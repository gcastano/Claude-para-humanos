<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero del call center de Cesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Cesta: verde de base, crema de fondo, dorado como acento escaso. Una sola paleta de marca (tema claro). */
:root{--verde:#0E3B2E;--crema:#F7F3EA;--dorado:#F4B942;--terra:#C75B39;--oliva:#6E8F7A;--tinta:#14201B;--linea:#E3DCCB;--papel:#FFFFFF;--suave:#ECE6D6;
--display:"Fraunces",Georgia,serif;--texto:"Inter",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--display);color:var(--verde);margin:0;text-wrap:balance}
h2{font-size:28px;line-height:1.2;font-weight:600;margin-bottom:6px}
h3{font-size:20px;line-height:1.3;font-weight:600;margin:0 0 8px}
p{margin:0 0 10px;max-width:70ch}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{background:var(--verde);color:var(--crema);padding:18px 0}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px}
.marca b{font-family:var(--display);font-size:22px;font-weight:600}
.ttl{flex:1;min-width:220px}
.ttl .t{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.ttl .s{font-size:13px;opacity:.9}
.btn{background:var(--crema);color:var(--verde);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:#fff}
nav.tabs{background:var(--crema);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:20}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:500;color:var(--verde);white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected=true]{border-bottom-color:var(--verde);font-weight:600}
nav.tabs button:hover{background:var(--suave)}
main{padding:28px 0 56px}
.lead{font-size:17px}
.muted{color:#4a5a52;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.chip{background:var(--papel);border:1px solid var(--linea);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--verde);color:var(--crema);border-color:var(--verde)}
.lbl{font-size:13px;font-weight:600;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{text-align:left;background:var(--papel);border:1px solid var(--linea);border-left:6px solid #cfc8b6;border-radius:10px;padding:12px 14px;cursor:pointer}
.card:hover{box-shadow:0 2px 10px rgba(14,59,46,.12)}
.card[aria-pressed=true]{outline:2px solid var(--verde)}
.card.rojo{border-left-color:var(--terra)}.card.amarillo{border-left-color:var(--dorado)}.card.verde{border-left-color:var(--oliva)}
.card .id{font-size:12px;font-weight:600;color:var(--verde);min-height:34px}
.card .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.card.rojo .v{color:var(--terra)}
.card .m{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-top:4px}
.dot{width:12px;height:12px;border-radius:50%;background:#cfc8b6;display:inline-block}
.dot.rojo{background:var(--terra)}.dot.amarillo{background:var(--dorado)}.dot.verde{background:var(--oliva)}
.panel{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:18px 20px;margin:16px 0}
.panel.sel{border-left:6px solid var(--verde)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid2 .panel{margin:0}
.hall{list-style:none;padding:0;margin:0;counter-reset:h}
.hall li{counter-increment:h;display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea);align-items:flex-start}
.hall li:before{content:counter(h);flex:none;width:28px;height:28px;border-radius:50%;background:var(--verde);color:var(--crema);font-weight:600;font-size:14px;text-align:center;line-height:28px}
.hall .txt{flex:1;max-width:80ch}
.link{background:none;border:0;color:var(--verde);font-weight:600;text-decoration:underline;cursor:pointer;padding:0;white-space:nowrap}
.top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.top3 div{background:var(--verde);color:var(--crema);border-radius:12px;padding:18px}
.top3 .n{font-family:var(--display);color:var(--dorado);font-size:28px;font-weight:700}
.top3 b{display:block;font-family:var(--display);font-size:18px;margin:2px 0 6px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto}
.ins{font-size:14px;margin-top:6px}
.tip{position:fixed;display:none;z-index:99;background:var(--tinta);color:var(--crema);border-radius:8px;padding:8px 10px;font-size:13px;pointer-events:none;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{color:var(--dorado)}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--papel)}
th{background:var(--verde);color:var(--crema);text-align:left;padding:9px 11px;font-weight:600;font-size:13px}
th button{background:none;border:0;color:inherit;font-weight:600;cursor:pointer;padding:0}
td{padding:9px 11px;border-bottom:1px solid var(--suave);vertical-align:top}
tr:nth-child(even) td{background:#FAF7EF}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--linea);border-radius:10px}
.heat td{text-align:center;font-variant-numeric:tabular-nums;border:2px solid var(--papel);padding:10px 6px;font-size:13px}
.heat td.rh,.heat th{text-align:left}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px}
.tag.ev{background:var(--verde);color:var(--crema)}.tag.hi{background:var(--papel);border:1px solid var(--oliva);color:var(--verde)}
.sim{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.sim .panel{margin:0}
.slider{margin:14px 0}
.slider label{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;color:var(--verde)}
.slider input[type=range]{width:100%;accent-color:var(--verde)}
.res{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.res div.b{flex:1;min-width:130px;background:var(--crema);border-radius:10px;padding:10px 12px}
.res .k{font-size:12px;color:#4a5a52}.res .big{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.res .up{color:var(--verde)}.res .dn{color:var(--terra)}
.foot{background:var(--verde);color:var(--crema);padding:20px 0;font-size:13px}
.pnav{display:none}
body.pres{font-size:19px}
body.pres header.top .ttl .s{display:none}
body.pres nav.tabs{display:none}
body.pres .pnav{display:flex;gap:10px;align-items:center;justify-content:center;position:sticky;bottom:0;background:var(--crema);border-top:1px solid var(--linea);padding:10px}
body.pres .btn{background:var(--verde);color:var(--crema)}
@media(max-width:600px){h2{font-size:23px}.wrap{padding:0 16px}}
@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <div class="marca"><svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#F7F3EA"/><path d="M34 44V34a16 16 0 0 1 32 0v10" fill="none" stroke="#F4B942" stroke-width="8"/><path d="M26 44h48l-6 36a8 8 0 0 1-8 7H40a8 8 0 0 1-8-7z" fill="#0E3B2E"/><rect x="29" y="55" width="42" height="4" rx="2" fill="#F7F3EA"/><rect x="32" y="68" width="36" height="4" rx="2" fill="#F7F3EA"/></svg><b>Cesta</b></div>
 <div class="ttl"><div class="t">Tablero del call center</div><div class="s" id="sub"></div></div>
 <button class="btn" id="btnPres" type="button" style="background:var(--crema);color:var(--verde)">Modo presentación</button>
</div></header>
<nav class="tabs" aria-label="Secciones"><div class="wrap" role="tablist" id="tabs"></div></nav>
<main class="wrap" id="main"></main>

<footer class="foot"><div class="wrap" id="foot"></div></footer>

window.DATA = /*__DATA__*/null;
</script>
<script>
(function(){
"use strict";
var D=window.DATA, T=D.tables, M=D.mats, X=D.extra, DX=D.dx, Q=D.dq, NA=D.narrativa;
var C={verde:'#0E3B2E',crema:'#F7F3EA',dorado:'#F4B942',terra:'#C75B39',oliva:'#6E8F7A',tinta:'#14201B',grid:'#E3DCCB',gris:'#CFC8B6'};
var KP={}; D.kpis.forEach(function(k){KP[k.id]=k;});
function nf(x,d){ if(x==null||isNaN(x)) return '—'; d=d==null?1:d; return new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}).format(x); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function el(tag,attrs){ var e=document.createElement(tag); attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){var v=attrs[k]; if(k==='class')e.className=v; else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v); else if(v===true)e.setAttribute(k,''); else if(v!==false&&v!=null)e.setAttribute(k,v);});
  for(var i=2;i<arguments.length;i++){ var c=arguments[i]; if(Array.isArray(c)){c.forEach(function(x){if(x!=null)e.append(x.nodeType?x:document.createTextNode(x));});} else if(c!=null){e.append(c.nodeType?c:document.createTextNode(c));} }
  return e; }
var NS='http://www.w3.org/2000/svg';
function sv(tag,attrs){ var e=document.createElementNS(NS,tag); attrs=attrs||{}; Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);}); for(var i=2;i<arguments.length;i++){var c=arguments[i]; if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));} return e; }
var ETQ={estado_envio:'Estado de envío',devolucion:'Devolución',problema_pago:'Problema de pago',cambio_producto:'Cambio de producto',facturacion:'Facturación',cuenta_claves:'Cuenta y claves',reclamo_calidad:'Reclamo de calidad',informacion_preventa:'Información preventa'};
var DOW={Monday:'Lunes',Tuesday:'Martes',Wednesday:'Miércoles',Thursday:'Jueves',Friday:'Viernes',Saturday:'Sábado',Sunday:'Domingo'};
var DEST={Area_Logistica:'Logística',Area_Billing:'Billing',Supervisor:'Supervisor','No escalada':'No escalada'};

/* ---------- Tooltip ---------- */
var tip=el('div',{class:'tip',role:'status'}); document.body.append(tip);
function showTip(ev,html){ tip.innerHTML=html; tip.style.display='block'; var r=tip.getBoundingClientRect(); var x=ev.clientX+14,y=ev.clientY+14;
  if(x+r.width>window.innerWidth-8)x=ev.clientX-r.width-14; if(y+r.height>window.innerHeight-8)y=ev.clientY-r.height-14;
  tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------- Métricas y dimensiones ---------- */
function fS(v){return nf(v,1)+' s';} function fP(v,d){return nf(v,d==null?1:d)+' %';} function fN(v){return nf(v,0);} function fH(v){return nf(v,1)+' h';} function fC(v){return nf(v,2);} function fV(v){return nf(v,0);}
var MET={
 llamadas:{label:'Llamadas',fmt:fN},
 abandono_pct:{label:'Abandono',fmt:fP,meta:8,better:'low',metaTxt:'meta ≤ 8 %'},
 nivel_servicio_pct:{label:'Nivel de servicio 80/20',fmt:fP,meta:80,better:'high',metaTxt:'meta ≥ 80 %'},
 espera_media_s:{label:'Espera media (todas)',fmt:fS,better:'low'},
 atendidas:{label:'Atendidas',fmt:fN},
 aht_s:{label:'AHT',fmt:fS,meta:360,better:'low',metaTxt:'máx. 360 s'},
 acw_s:{label:'ACW',fmt:fS,meta:30,better:'low',metaTxt:'meta ≤ 30 s'},
 escalamiento_pct:{label:'Escalamiento',fmt:fP,meta:15,better:'low',metaTxt:'meta ≤ 15 %'},
 casos:{label:'Casos',fmt:fN},
 fcr_pct:{label:'FCR',fmt:fP,meta:75,better:'high',metaTxt:'meta ≥ 75 %'},
 reincid_pct:{label:'Reincidencia',fmt:fP,meta:5,better:'low',metaTxt:'meta ≤ 5 %'},
 pendiente_pct:{label:'Backlog pendiente',fmt:fP,meta:10,better:'low',metaTxt:'meta ≤ 10 %'},
 horas_res:{label:'Horas de resolución',fmt:fH,meta:24,better:'low',metaTxt:'meta ≤ 24 h'},
 csat:{label:'CSAT',fmt:fC,meta:4,better:'high',metaTxt:'meta ≥ 4,0',domain:[0,5]},
 top2_pct:{label:'CSAT top-2 box',fmt:fP,meta:80,better:'high',metaTxt:'meta ≥ 80 %'},
 insatisf_pct:{label:'Insatisfechos (CSAT ≤ 2)',fmt:fP,meta:10,better:'low',metaTxt:'meta ≤ 10 %'},
 valor_riesgo:{label:'Valor en riesgo',fmt:fV},
 riesgo_pct:{label:'% del valor en riesgo',fmt:fP,better:'low'},
 valor_pendiente:{label:'Valor pendiente',fmt:fV},
 valor_total:{label:'Valor total',fmt:fV}
};
var DIM={
 hora:{label:'Hora',lab:function(k){return k+' h';}},
 dia_semana:{label:'Día de la semana',lab:function(k){return (DOW[k]||k).slice(0,3);},full:function(k){return DOW[k]||k;}},
 cola:{label:'Cola',lab:function(k){return String(k).replace('_',' ');},horizontal:true},
 motivo:{label:'Motivo',lab:function(k){return ETQ[k]||k;},horizontal:true},
 semana:{label:'Semana',lab:function(k){return k.slice(8,10)+'/'+k.slice(5,7);},full:function(k){return 'Semana del '+k.slice(8,10)+'/'+k.slice(5,7);}}
};
function niceMax(v){ if(v<=0)return 1; var p=Math.pow(10,Math.floor(Math.log10(v))); var f=v/p; var n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*p; }
function ticks(span,n){ if(n===4){ var q=Math.round(span*1000); if(q%5===0)n=5; } var out=[],step=span/n; for(var i=0;i<=n;i++)out.push(step*i); return out; }

/* ---------- Gráfico de barras (vertical u horizontal) ---------- */
function barChart(host,rows,o){
  host.innerHTML='';
  var W=Math.max(280,host.clientWidth||640), horiz=!!o.horizontal, m=MET[o.metric]||{}, fmt=o.fmt||m.fmt||fN;
  var n=rows.length; if(!n){host.append(el('p',{class:'muted'},'Sin datos para mostrar.'));return {worst:-1};}
  var vals=rows.map(function(r){return r.value;});
  var vmax=Math.max.apply(null,vals.concat(o.meta!=null?[o.meta]:[])), vmin=Math.min.apply(null,vals);
  var dom=o.domain||m.domain; var lo=0, hi=niceMax(vmax*1.08);
  if(dom){lo=dom[0];hi=dom[1];}
  if(o.zoom){ lo=Math.floor(Math.min(vmin,o.meta!=null?o.meta:vmin)*0.97*100)/100; hi=vmax*1.02; }
  var better=o.better!==undefined?o.better:m.better; var worst=-1;
  if(better==='low'){worst=vals.indexOf(Math.max.apply(null,vals));} else if(better==='high'){worst=vals.indexOf(vmin);}
  var colorFn=o.colorFn||function(r,i){return i===worst?C.terra:C.verde;};
  var svg;
  if(horiz){
    var lm=Math.min(170,Math.max(70,Math.max.apply(null,rows.map(function(r){return r.label.length;}))*7.2)), rm=70, tm=14, bm=28, bh=o.bandH||26;
    var H=tm+bm+n*bh; svg=sv('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':o.title||'Gráfico'});
    var x=function(v){return lm+(v-lo)/(hi-lo)*(W-lm-rm);};
    ticks(hi-lo,4).forEach(function(t){var xx=x(lo+t); svg.append(sv('line',{x1:xx,x2:xx,y1:tm,y2:H-bm,stroke:C.grid})); svg.append(sv('text',{x:xx,y:H-bm+16,'text-anchor':'middle','font-size':11,fill:C.tinta},nf(lo+t,(hi-lo)<10?1:0)));});
    rows.forEach(function(r,i){var y=tm+i*bh; var w=Math.max(1,x(r.value)-lm);
      svg.append(sv('text',{x:lm-8,y:y+bh/2+4,'text-anchor':'end','font-size':12,fill:C.tinta},r.label));
      svg.append(sv('rect',{x:lm,y:y+4,width:w,height:bh-8,rx:3,fill:r.muted?C.gris:colorFn(r,i)}));
      svg.append(sv('text',{x:lm+w+6,y:y+bh/2+4,'font-size':12,fill:C.tinta,'font-weight':600},fmt(r.value)));
      var hit=sv('rect',{x:0,y:y,width:W,height:bh,fill:'transparent'}); bindTip(hit,r,o,fmt); svg.append(hit); });
    if(o.meta!=null&&o.meta>=lo&&o.meta<=hi){var mx=x(o.meta); svg.append(sv('line',{x1:mx,x2:mx,y1:tm,y2:H-bm,stroke:C.terra,'stroke-dasharray':'5 4','stroke-width':1.5})); svg.append(sv('text',{x:mx,y:tm-3,'text-anchor':'middle','font-size':11,fill:C.terra,'font-weight':700},o.metaLabel||'meta'));}
  } else {
    var lm2=46, rm2=12, tm2=22, bm2=34, H2=o.height||300; svg=sv('svg',{viewBox:'0 0 '+W+' '+H2,role:'img','aria-label':o.title||'Gráfico'});
    var y2=function(v){return H2-bm2-(v-lo)/(hi-lo)*(H2-bm2-tm2);}; var band=(W-lm2-rm2)/n, bw=Math.min(54,band*0.68);
    ticks(hi-lo,4).forEach(function(t){var yy=y2(lo+t); svg.append(sv('line',{x1:lm2,x2:W-rm2,y1:yy,y2:yy,stroke:C.grid})); svg.append(sv('text',{x:lm2-6,y:yy+4,'text-anchor':'end','font-size':11,fill:C.tinta},nf(lo+t,(hi-lo)<10?1:0)));});
    rows.forEach(function(r,i){var cx=lm2+band*i+band/2; var top=y2(r.value);
      svg.append(sv('rect',{x:cx-bw/2,y:top,width:bw,height:Math.max(1,H2-bm2-top),rx:3,fill:r.muted?C.gris:colorFn(r,i)}));
      svg.append(sv('text',{x:cx,y:H2-bm2+16,'text-anchor':'middle','font-size':n>12?10:12,fill:C.tinta},r.label));
      if(n<=9) svg.append(sv('text',{x:cx,y:top-5,'text-anchor':'middle','font-size':11,fill:C.tinta,'font-weight':600},fmt(r.value)));
      var hit=sv('rect',{x:cx-band/2,y:tm2-10,width:band,height:H2-tm2-bm2+10,fill:'transparent'}); bindTip(hit,r,o,fmt); svg.append(hit); });
    if(o.meta!=null&&o.meta>=lo&&o.meta<=hi){var my=y2(o.meta); svg.append(sv('line',{x1:lm2,x2:W-rm2,y1:my,y2:my,stroke:C.terra,'stroke-dasharray':'5 4','stroke-width':1.5})); svg.append(sv('text',{x:W-rm2,y:my-5,'text-anchor':'end','font-size':11,fill:C.terra,'font-weight':700},o.metaLabel||'meta'));}
  }
  host.append(svg);
  return {worst:worst};
}
function bindTip(node,r,o,fmt){
  var h=function(ev){ showTip(ev,'<b>'+esc(r.full||r.label)+'</b><br>'+esc(o.metricLabel||'Valor')+': '+esc(fmt(r.value))+(r.extra?'<br>'+r.extra:'')); };
  node.addEventListener('pointermove',h); node.addEventListener('pointerdown',h); node.addEventListener('pointerleave',hideTip);
}

/* ---------- Línea (tendencia) ---------- */
function lineChart(host,xs,ys,o){
  host.innerHTML=''; var W=Math.max(240,host.clientWidth||300),H=190,l=40,r=12,t=14,b=28;
  var lo=o.lo,hi=o.hi; var x=function(i){return l+(W-l-r)*(xs.length===1?0.5:i/(xs.length-1));}; var y=function(v){return H-b-(v-lo)/(hi-lo)*(H-t-b);};

function explorer(key,cfg){

  var root=el('div',{class:'panel'}); var head=el('div',null);

function heat(m,o){
  var flat=[].concat.apply([],m.values.map(function(r){return r.map(function(v){return v||0;});}));
  var max=o.max||Math.max.apply(null,flat);
  var tbl=el('table',{class:'heat'}); var hr=el('tr',null,el('th',null,o.corner||''));
  m.cols.forEach(function(c){hr.append(el('th',{class:'num'},o.colLab?o.colLab(c):c));}); tbl.append(hr);
  m.rows.forEach(function(rw,i){ var tr=el('tr',null,el('td',{class:'rh'},o.rowLab?o.rowLab(rw):rw));
    m.values[i].forEach(function(v,j){ var a=v==null?0:Math.min(1,v/max); var bg='rgba(14,59,46,'+(0.08+a*0.82).toFixed(2)+')'; var td=el('td',{style:'background:'+bg+';color:'+(a>0.5?C.crema:C.tinta)},v==null?'—':nf(v,o.dec==null?0:o.dec)+(o.unit||''));
      var f=function(ev){showTip(ev,'<b>'+esc(o.rowLab?o.rowLab(rw):rw)+' · '+esc(o.colLab?o.colLab(m.cols[j]):m.cols[j])+'</b><br>'+esc(o.name)+': '+esc(v==null?'—':nf(v,o.dec==null?1:o.dec)+(o.unit||''))+(o.cnt?'<br>Llamadas: '+esc(nf(o.cnt.values[i][j],0)):''));};
      td.addEventListener('pointermove',f);td.addEventListener('pointerdown',f);td.addEventListener('pointerleave',hideTip); tr.append(td); });
    tbl.append(tr); });
  return el('div',{class:'tw'},tbl);
}

  var idx=TABS.indexOf(t); document.getElementById('pos').textContent=(idx+1)+' / '+TABS.length+' · '+t.t;

}
